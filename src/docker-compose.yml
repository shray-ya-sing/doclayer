services:
  doclayer-webapi:
    image: doclayer-webapi-dev
    build:
      context: .
      # Point this to the subfolder where your Dockerfile lives
      dockerfile: doclayer_webapi/doclayer_webapi/Dockerfile 
    ports:
      - "5245:8080"  # Fixed Host Port : Internal Container Port
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - ~/.aspnet/https:/https:ro
